<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Analysis | GreenPowerSense</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
    padding:40px 20px;
}
.container{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:20px;
    max-width:500px;
    margin:auto;
}
h1{
    color:#00ff99;
    margin-bottom:20px;
}
input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
    outline:none;
}
button{
    margin-top:20px;
    padding:12px 30px;
    border:none;
    border-radius:50px;
    background:linear-gradient(45deg,#00ff99,#00cc77);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.4s;
}
button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00ff99;
}
.result{
    margin-top:20px;
    font-size:1.1rem;
}
</style>
</head>
<body>

<div class="container">
    <h1>⚡ Bill Analysis</h1>

    <select id="month">
        <option value="">Select Month</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>August</option>
        <option>September</option>
        <option>October</option>
        <option>November</option>
        <option>December</option>
    </select>

    <input type="number" id="units" placeholder="Enter Units (kWh)">

    <button onclick="calculateBill()">Calculate & Save</button>

    <div class="result" id="result"></div>

    <button onclick="location.href='dashboard.html'">📊 Go to Dashboard</button>
</div>

<script>

// LOGIN CHECK
const user = localStorage.getItem("gpsUser");
if(!user){
    window.location.href = "login.html";
}

// Calculate and Save
function calculateBill(){

    const month = document.getElementById("month").value;
    const units = parseFloat(document.getElementById("units").value);

    if(!month || !units){
        alert("Please enter month and units");
        return;
    }

    const rate = 6; // ₹6 per unit
    const billAmount = units * rate;
    const carbon = units * 0.82; // CO2 factor

    document.getElementById("result").innerHTML =
        `💡 Bill Amount: ₹${billAmount.toFixed(2)} <br>
         🌍 CO₂ Emission: ${carbon.toFixed(2)} kg`;

    // Load existing user history
    let userHistory = JSON.parse(
        localStorage.getItem("energyHistory_" + user)
    ) || [];

    // Remove same month if already exists
    userHistory = userHistory.filter(item => item.month !== month);

    // Add new record
    userHistory.push({
        month: month,
        units: units,
        carbon: carbon.toFixed(2)
    });

    // Save back to user-specific storage
    localStorage.setItem(
        "energyHistory_" + user,
        JSON.stringify(userHistory)
    );
}

</script>

</body>
</html>

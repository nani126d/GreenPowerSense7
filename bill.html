<!DOCTYPE html>
<html>
<head>
    <title>Home - Eco Energy Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f9f4;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: green;
        }

        .container {
            background: white;
            padding: 30px;
            margin: auto;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 10px;
            width: 70%;
        }

        button {
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: darkgreen;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Welcome to Eco Energy System</h1>

<div class="container">

    <h2>Upload Your Electricity Bill</h2>

    <input type="file" id="billUpload" accept=".jpg,.jpeg,.png,.pdf">
    <br>

    <input type="number" id="units" placeholder="Or Enter Units Consumed (Example: 250)">
    <br>

    <button onclick="analyzeBill()">Bill Analysis</button>
    <button onclick="solarEstimate()">Solar Estimation</button>
    <button onclick="applianceAnalysis()">Appliance Analysis</button>
    <button onclick="goDashboard()">Go to Dashboard</button>

    <div id="result"></div>

</div>

<script>

function analyzeBill() {
    let units = document.getElementById("units").value;

    if(units == "") {
        alert("Please enter units consumed from bill.");
        return;
    }

    let co2 = units * 0.82;   // Average CO2 per unit in India
    let cost = units * 6;     // Approx cost per unit

    document.getElementById("result").innerHTML =
        "Total Units: " + units + " kWh <br>" +
        "Estimated CO2 Emission: " + co2.toFixed(2) + " kg <br>" +
        "Estimated Bill Cost: ₹" + cost;
}

function solarEstimate() {
    let units = document.getElementById("units").value;

    if(units == "") {
        alert("Please enter units first.");
        return;
    }

    let requiredKW = units / 120;   // Avg 120 units per 1kW solar per month
    let solarCost = requiredKW * 55000;

    document.getElementById("result").innerHTML =
        "Recommended Solar Capacity: " + requiredKW.toFixed(2) + " kW <br>" +
        "Estimated Installation Cost: ₹" + solarCost.toFixed(0);
}

function applianceAnalysis() {
    alert("Appliance Analysis page coming next. We will connect it separately.");
}

function goDashboard() {
    window.location.href = "dashboard.html";
}

</script>

</body>
</html>

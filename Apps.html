<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appliance Usage | GreenPowerSense</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
    padding:50px 20px;
    overflow-x:hidden;
}
#particles{position:fixed;width:100%;height:100%;top:0;left:0;z-index:-1;}
.container{
    max-width:600px;
    margin:auto;
    padding:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:20px;
    opacity:0;
    transform:translateY(50px);
    transition:0.8s;
}
h1{color:#00ff99;margin-bottom:20px;}
input{width:80%;padding:12px;margin:10px 0;border:none;border-radius:10px;}
button{
    padding:12px 25px;
    background:linear-gradient(45deg,#00ff99,#00cc77);
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    transition:0.5s;
}
button:hover{transform:scale(1.05);box-shadow:0 0 25px #00ff99;}
.result{margin-top:25px;color:#00ff99;line-height:1.6;font-size:1rem;}
a{display:block;margin-top:30px;color:#00ff99;text-decoration:none;}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container" id="appsContainer">
<h1>📱 Appliance Usage</h1>
<input type="text" id="appliance" placeholder="Enter Appliance Name">
<input type="number" id="hours" placeholder="Hours used per day">
<button onclick="addAppliance()">Add Appliance Usage</button>

<div class="result" id="output"></div>

<a href="dashboard.html">⬅ Go to Dashboard</a>
</div>

<script>
// Particle background
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let particles=[];
for(let i=0;i<100;i++){
    particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+1,dx:(Math.random()-0.5)*0.5,dy:(Math.random()-0.5)*0.5});
}
function animateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="rgba(0,255,153,0.7)";
        ctx.fill();
        p.x+=p.dx; p.y+=p.dy;
        if(p.x<0||p.x>canvas.width)p.dx*=-1;
        if(p.y<0||p.y>canvas.height)p.dy*=-1;
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

// Animate container entrance
window.onload=()=>{
    const container=document.getElementById("appsContainer");
    setTimeout(()=>{container.style.opacity="1";container.style.transform="translateY(0)";},200);
}

// Add appliance usage
function addAppliance(){
    let appliance=document.getElementById("appliance").value;
    let hours=document.getElementById("hours").value;
    if(!appliance||!hours){alert("Enter appliance and hours"); return;}
    hours=parseFloat(hours);
    // Assuming 1 unit per hour (simplified)
    let units=hours;
    let carbon=units*0.82;

    let month=new Date().toLocaleString('default',{month:'short',year:'numeric'});
    let history=JSON.parse(localStorage.getItem("energyHistory"))||[];
    history.push({month,units,carbon:carbon.toFixed(2)});
    localStorage.setItem("energyHistory",JSON.stringify(history));

    document.getElementById("output").innerHTML=`✅ ${appliance} usage saved.<br>Units: ${units}, CO₂: ${carbon.toFixed(2)} kg`;
    document.getElementById("appliance").value="";
    document.getElementById("hours").value="";
}
</script>

</body>
</html>

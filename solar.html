<!DOCTYPE html>
<html>
<head>
    <title>Solar Estimation Result</title>
    <style>
        body {
            font-family: Arial;
            background: #eaffea;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            width: 60%;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: green;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<h1>Solar Panel Estimation</h1>

<div class="box">

    <div id="result"></div>

    <br><br>

    <button onclick="goDashboard()">Go to Dashboard</button>
    <button onclick="goHome()">Back to Home</button>

</div>

<script>

let units = localStorage.getItem("units");
let amount = localStorage.getItem("amount");
let co2 = localStorage.getItem("co2");
let requiredKW = localStorage.getItem("requiredKW");
let solarCost = localStorage.getItem("solarCost");
let payback = localStorage.getItem("payback");

if(units) {

    document.getElementById("result").innerHTML =
        "<b>Monthly Units:</b> " + units + " kWh <br><br>" +
        "<b>Bill Amount:</b> ₹" + amount + "<br><br>" +
        "<b>CO2 Emission:</b> " + parseFloat(co2).toFixed(2) + " kg<br><br>" +
        "<b>Recommended Solar Capacity:</b> " + parseFloat(requiredKW).toFixed(2) + " kW<br><br>" +
        "<b>Estimated Installation Cost:</b> ₹" + parseFloat(solarCost).toFixed(0) + "<br><br>" +
        "<b>Estimated Payback Period:</b> " + parseFloat(payback).toFixed(1) + " years";

} else {
    document.getElementById("result").innerHTML =
        "No data found. Please analyze from Home page.";
}

function goDashboard() {
    window.location.href = "dashboard.html";
}

function goHome() {
    window.location.href = "home.html";
}

</script>

</body>
</html>

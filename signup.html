<!DOCTYPE html>
<html>
<head>
<title>Sign Up - GreenPowerSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:flex-end;  /* RIGHT SIDE */
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background: url("GreenPowerSense8.jpg") no-repeat center center/cover;
}

.signup-box{
    width:480px;  /* MORE WIDTH */
    padding:35px 40px;
    margin-right:60px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
    color:white;
}

.signup-box h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border:none;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#3498db;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2980b9;
}

a{
    color:#fff;
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="signup-box">
    <h2>Create Account</h2>

    <form onsubmit="signupUser(event)">
        <input type="text" id="signupUsername" placeholder="Username" required>
        <input type="password" id="signupPassword" placeholder="Password" required>
        <button type="submit">Sign Up</button>
    </form>

    <p style="text-align:center;margin-top:15px;">
        Already have an account?
        <a href="login.html">Login</a>
    </p>
</div>

<script>
function signupUser(e){
    e.preventDefault();

    let username = document.getElementById("signupUsername").value;
    let password = document.getElementById("signupPassword").value;

    localStorage.setItem("gps_username", username);
    localStorage.setItem("gps_password", password);
    localStorage.setItem("gps_loggedin", "true");

    alert("Account Created Successfully!");
    window.location.href = "index.html";
}
</script>

</body>
</html>

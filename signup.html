<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - GreenPowerSense</title>

<style>

body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    height:100vh;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding-right:80px;

    background: url('GreenPowerSense8.jpg') no-repeat center center/cover;
}

/* Signup Box */
.signup-box{
    width:500px;           /* 🔥 Wider than login */
    padding:40px;
    background: rgba(255,255,255,0.95);
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    background:#1e293b;
    color:white;
    transition:0.3s;
}

button:hover{
    background:#0f172a;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    text-decoration:none;
    color:#1e293b;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="signup-box">
    <h2>Create Account</h2>

    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email Address">
    <input type="password" placeholder="Password">
    <input type="password" placeholder="Confirm Password">

    <button onclick="signup()">Sign Up</button>

    <p>Already have an account? 
       <a href="login.html">Login here</a>
    </p>
</div>

<script>
function signup(){
    alert("Signup functionality will be connected to backend later.");
}
</script>

</body>
</html>

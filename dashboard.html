<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | GreenPowerSense</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background: url('GreenPowerSense9.jpg') no-repeat center center/cover;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Dark overlay for professional look */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:0;
}

.dashboard{
    position:relative;
    z-index:1;
    width:90%;
    max-width:1000px;
    background:rgba(255,255,255,0.95);
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

h1{
    margin:0;
    font-size:28px;
    color:#1e3c72;
}

.subtitle{
    margin-top:5px;
    color:gray;
}

.section{
    margin-top:40px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    padding:14px 20px;
    border:none;
    border-radius:10px;
    background:#1e3c72;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2a5298;
}

.result{
    margin-top:20px;
    padding:20px;
    border-radius:12px;
    background:#f4f6fb;
    display:none;
}

.logout{
    float:right;
    background:#d9534f;
}

.logout:hover{
    background:#c9302c;
}
</style>
</head>

<body>

<div class="dashboard">

    <button class="logout" onclick="logout()">Logout</button>

    <h1>GreenPowerSense Dashboard</h1>
    <p class="subtitle">Analyze your Green Energy savings smartly</p>

    <div class="section">
        <h2>Electricity Bill & Green Energy Calculator</h2>

        <input type="number" id="units" placeholder="Enter Monthly Units (kWh)">
        <input type="number" id="rate" placeholder="Enter Cost per Unit (₹)">
        <button onclick="calculate()">Calculate</button>

        <div class="result" id="resultBox">
            <h3>Results:</h3>
            <p id="monthlyBill"></p>
            <p id="yearlyBill"></p>
            <p id="solarPanels"></p>
            <p id="savings"></p>
        </div>
    </div>

</div>

<script>

function calculate(){
    let units = document.getElementById("units").value;
    let rate = document.getElementById("rate").value;

    if(units === "" || rate === ""){
        alert("Please enter all fields");
        return;
    }

    let monthlyBill = units * rate;
    let yearlyBill = monthlyBill * 12;

    let panelOutput = 400; 
    let dailyNeed = units / 30;
    let panelsNeeded = Math.ceil((dailyNeed * 1000) / panelOutput);

    let yearlySavings = yearlyBill * 0.7;

    document.getElementById("monthlyBill").innerHTML = 
        "Monthly Electricity Bill: ₹ " + monthlyBill.toFixed(2);

    document.getElementById("yearlyBill").innerHTML = 
        "Yearly Electricity Bill: ₹ " + yearlyBill.toFixed(2);

    document.getElementById("solarPanels").innerHTML = 
        "Estimated Solar Panels Required: " + panelsNeeded;

    document.getElementById("savings").innerHTML = 
        "Estimated Yearly Savings with Green Energy: ₹ " + yearlySavings.toFixed(2);

    document.getElementById("resultBox").style.display = "block";
}

function logout(){
    window.location.href = "index.html";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #eaffea;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: green;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 95%;
            background: white;
        }

        th, td {
            border: 1px solid gray;
            padding: 8px;
        }

        th {
            background: green;
            color: white;
        }

        button {
            padding: 10px 20px;
            margin: 15px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<h1>Dashboard</h1>

<h3 id="welcome"></h3>

<div id="historySection"></div>

<button onclick="goHome()">Analyze New Bill</button>
<button onclick="logout()">Logout</button>

<script>

let username = localStorage.getItem("currentUser");

if(!username) {
    window.location.href = "login.html";
}

document.getElementById("welcome").innerHTML = "Welcome, " + username;

// Get user history
let history = JSON.parse(localStorage.getItem("history_" + username)) || [];

if(history.length === 0) {
    document.getElementById("historySection").innerHTML = 
        "<p>No analysis history available.</p>";
} else {

    let table = "<table>";
    table += "<tr>";
    table += "<th>Date</th>";
    table += "<th>Units</th>";
    table += "<th>Amount (₹)</th>";
    table += "<th>CO2 (kg)</th>";
    table += "<th>Solar Required (kW)</th>";
    table += "<th>Solar Cost (₹)</th>";
    table += "<th>Payback (Years)</th>";
    table += "</tr>";

    history.forEach(record => {
        table += "<tr>";
        table += "<td>" + record.date + "</td>";
        table += "<td>" + record.units + "</td>";
        table += "<td>" + record.amount + "</td>";
        table += "<td>" + record.co2 + "</td>";
        table += "<td>" + record.solarKW + "</td>";
        table += "<td>" + record.solarCost + "</td>";
        table += "<td>" + record.payback + "</td>";
        table += "</tr>";
    });

    table += "</table>";

    document.getElementById("historySection").innerHTML = table;
}

function goHome() {
    window.location.href = "home.html";
}

function logout() {
    localStorage.removeItem("currentUser");
    window.location.href = "login.html";
}

</script>

</body>
</html>

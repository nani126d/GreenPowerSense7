<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenPowerSense - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body {
            background: url('GreenPowerSense1.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        .container { width:90%; max-width:1200px; margin:auto; padding:20px 0; }

        section { margin:60px 0; backdrop-filter: blur(5px); background-color: rgba(0,0,0,0.5); border-radius:15px; padding:40px; }
        h2 { text-align:center; margin-bottom:30px; font-size:2rem; color:#f1c40f; }

        #usageChart { max-width:600px; margin:auto; }

        .cards { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }
        .card { background-color: rgba(46, 204, 113,0.2); border-radius:15px; width:250px; padding:20px; text-align:center; transition: transform 0.3s, box-shadow 0.3s; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card h3 { margin-bottom:15px; color:#2ecc71; }
        .card p { font-size:0.9rem; }
        .card button { margin-top:15px; padding:8px 16px; border:none; border-radius:8px; background:#f1c40f; color:#000; cursor:pointer; font-weight:600; }
        .card button:hover { background:#d4ac0d; }

        footer { text-align:center; padding:20px; background: rgba(0,0,0,0.6); border-radius:10px; margin-bottom:30px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Section 1: Bill Analysis -->
        <section>
            <h2>Electricity Usage Analysis</h2>
            <canvas id="usageChart"></canvas>
            <p id="analysisText" style="text-align:center; margin-top:15px;"></p>
        </section>

        <!-- Section 2: Solar Quote -->
        <section>
            <h2>Solar Quote & Cost Estimate</h2>
            <p id="solarText" style="text-align:center; font-size:1.1rem;"></p>
        </section>

        <!-- Section 3: Green Energy Recommendations -->
        <section>
            <h2>Green Energy Recommendations</h2>
            <div class="cards" id="recommendationCards">
                <!-- Cards will be generated dynamically -->
            </div>
        </section>

        <footer>
            &copy; 2026 GreenPowerSense | Intelligent Energy Solutions
        </footer>
    </div>

    <script>
        // Load data from localStorage
        const units = parseFloat(localStorage.getItem('billUnits'));
        const cost = parseFloat(localStorage.getItem('billCost'));
        const selectedAppliances = JSON.parse(localStorage.getItem('selectedAppliances')) || [];

        // Analysis
        const avgCostPerUnit = (cost/units).toFixed(2);
        document.getElementById('analysisText').innerText = `Your average cost per unit is ₹${avgCostPerUnit}/unit.`;

        // Usage chart
        const ctx = document.getElementById('usageChart').getContext('2d');
        const weeklyData = [units*0.25, units*0.25, units*0.25, units*0.25];
        new Chart(ctx, {
            type:'bar',
            data:{
                labels:['Week1','Week2','Week3','Week4'],
                datasets:[{label:'Units Consumed', data:weeklyData, backgroundColor:'#2ecc71'}]
            },
            options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true } } }
        });

        // Solar Quote based on total units + appliance extra
        let applianceUnits = selectedAppliances.reduce((sum,a)=>sum+a.units,0);
        let totalUnits = units + applianceUnits;
        let solarKwNeeded = (totalUnits / 30 / 4).toFixed(1); // approx kW needed
        let solarCost = (solarKwNeeded*50000).toLocaleString();
        let savings = (totalUnits*12*avgCostPerUnit*0.7).toLocaleString();
        document.getElementById('solarText').innerText = `Estimated Solar Panels Needed: ${solarKwNeeded} kW | Installation Cost: ₹${solarCost} | Yearly Savings: ₹${savings}`;

        // Green energy recommendations
        const recommendations = [
            {name:'Solar Panels', desc:'Roof-top solar panels to save electricity costs and reduce carbon footprint.'},
            {name:'Wind Turbines', desc:'Small/medium turbines for homes or farms, generating renewable energy efficiently.'},
            {name:'Hydro Energy', desc:'Use nearby water streams to generate sustainable electricity for your home.'},
            {name:'Biogas / Biomass', desc:'Convert organic waste into energy; eco-friendly alternative for households.'}
        ];

        const cardsContainer = document.getElementById('recommendationCards');
        recommendations.forEach(r=>{
            const card = document.createElement('div');
            card.className='card';
            card.innerHTML=`<h3>${r.name}</h3><p>${r.desc}</p><button>Learn More</button>`;
            cardsContainer.appendChild(card);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Home - Electricity Bill Analysis</title>
    <style>
        body {
            font-family: Arial;
            background: #f2fff2;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            width: 60%;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: green;
        }

        input {
            width: 70%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        #message {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>
<body>

<h1>Electricity Bill Analysis</h1>

<div class="container">

    <!-- Upload Bill -->
    <input type="file" id="billFile" accept=".jpg,.jpeg,.png,.pdf">
    <br>

    <!-- Manual Entry -->
    <input type="number" id="units" placeholder="Enter Monthly Units (Example: 250)">
    <br>

    <input type="number" id="amount" placeholder="Enter Bill Amount (Example: 1500)">
    <br>

    <button onclick="analyzeAndSave()">Analyze & Go to Dashboard</button>

    <div id="message"></div>

</div>

<script>

function analyzeAndSave() {

    let units = document.getElementById("units").value;
    let amount = document.getElementById("amount").value;
    let file = document.getElementById("billFile").files[0];

    if(units === "" || amount === "") {
        document.getElementById("message").innerHTML =
            "Please enter Units and Bill Amount.";
        return;
    }

    let username = localStorage.getItem("currentUser");

    if(!username) {
        window.location.href = "login.html";
        return;
    }

    // Calculations
    let co2 = units * 0.82;
    let requiredKW = units / 120;
    let solarCost = requiredKW * 55000;
    let yearlySavings = amount * 12;
    let payback = solarCost / yearlySavings;

    let record = {
        date: new Date().toLocaleDateString(),
        units: units,
        amount: amount,
        co2: co2.toFixed(2),
        solarKW: requiredKW.toFixed(2),
        solarCost: solarCost.toFixed(0),
        payback: payback.toFixed(1),
        billUploaded: file ? file.name : "Not Uploaded"
    };

    let history = JSON.parse(localStorage.getItem("history_" + username)) || [];
    history.push(record);

    localStorage.setItem("history_" + username, JSON.stringify(history));

    window.location.href = "dashboard.html";
}

</script>

</body>
</html>

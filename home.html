<!DOCTYPE html>
<html>
<head>
    <title>Home - Energy Analysis</title>
    <style>
        body {
            font-family: Arial;
            background: #f2fff2;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            width: 60%;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: green;
        }

        input {
            padding: 10px;
            width: 70%;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<h1>Upload & Analyze Electricity Bill</h1>

<div class="box">

    <input type="file" id="billUpload" accept=".jpg,.jpeg,.png,.pdf"><br>

    <input type="number" id="units" placeholder="Enter Monthly Units (Example: 250)"><br>

    <input type="number" id="amount" placeholder="Enter Bill Amount (Example: 1500)"><br>

    <button onclick="analyzeAndEstimate()">Analyze & Estimate Solar</button>

</div>

<script>

function analyzeAndEstimate() {

    let units = document.getElementById("units").value;
    let amount = document.getElementById("amount").value;

    if(units == "" || amount == "") {
        alert("Please enter Units and Bill Amount.");
        return;
    }

    // CO2 Calculation
    let co2 = units * 0.82;

    // Solar calculation
    let requiredKW = units / 120;  // 1kW ≈ 120 units/month
    let solarCost = requiredKW * 55000;

    // Payback period
    let yearlySavings = amount * 12;
    let payback = solarCost / yearlySavings;

    // Store all data
    localStorage.setItem("units", units);
    localStorage.setItem("amount", amount);
    localStorage.setItem("co2", co2);
    localStorage.setItem("requiredKW", requiredKW);
    localStorage.setItem("solarCost", solarCost);
    localStorage.setItem("payback", payback);

    // Redirect automatically
    window.location.href = "solar.html";
}

</script>

</body>
</html>

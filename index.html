<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenPowerSense | Home</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

html, body {
    height: 100%;
}

body {
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#particles {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -1;
}

.container {
    text-align: center;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 50px 20px;
    opacity: 0;
    transform: translateY(50px);
    transition: 0.8s;
    max-width: 400px;
}

h1 {
    color: #00ff99;
    margin-bottom: 30px;
    font-size: 2.2rem;
}

button {
    width: 80%;
    padding: 15px;
    margin: 15px 0;
    border: none;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(45deg,#00ff99,#00cc77);
    color: white;
    font-size: 1rem;
    transition: 0.5s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #00ff99;
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container" id="homeContainer">
    <h1>🌿 GreenPowerSense</h1>
    <button onclick="location.href='dashboard.html'">Dashboard</button>
    <button onclick="location.href='bill.html'">Bill Analysis</button>
    <button onclick="location.href='apps.html'">Appliances</button>
    <button onclick="location.href='solar.html'">Solar Estimation</button>
</div>

<script>
// Firefly-style particle animation
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Firefly {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = -Math.random() * 0.5;
        this.alpha = Math.random() * 0.7 + 0.3;
        this.alphaChange = Math.random() * 0.02;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha += this.alphaChange;
        if(this.alpha > 1 || this.alpha < 0.3) this.alphaChange *= -1;
        if(this.y < -10) this.y = canvas.height + 10;
        if(this.x < -10) this.x = canvas.width + 10;
        if(this.x > canvas.width + 10) this.x = -10;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,255,153,${this.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(0,255,153,0.7)";
        ctx.fill();
    }
}

let fireflies = [];
for(let i=0;i<100;i++){
    fireflies.push(new Firefly());
}

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    fireflies.forEach(f=>{
        f.update();
        f.draw();
    });
    requestAnimationFrame(animate);
}
animate();

// Animate container entrance
window.onload = () => {
    const container = document.getElementById("homeContainer");
    setTimeout(() => {
        container.style.opacity = "1";
        container.style.transform = "translateY(0)";
    }, 200);
}

// Handle window resize
window.onresize = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
</script>

</body>
</html>

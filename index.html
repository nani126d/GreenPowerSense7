<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenPowerSense</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
        linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
        url("GreenPowerSense.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    min-height:100vh;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
}

.logo{
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:2px;
}

.nav-links{
    display:flex;
    gap:40px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-weight:500;
    transition:0.3s;
}

.nav-links a:hover{
    color:#1e90ff;
}

.nav-right{
    display:flex;
    gap:15px;
    align-items:center;
}

.user-profile{
    background:rgba(255,255,255,0.2);
    padding:8px 15px;
    border-radius:20px;
    display:none;
}

.logout-btn{
    background:#ff4d4d;
    border:none;
    padding:6px 15px;
    border-radius:20px;
    color:white;
    cursor:pointer;
    display:none;
}

.logout-btn:hover{
    background:#cc0000;
}

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding-top:80px;
}

.hero h2{
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:2px;
    margin-bottom:15px;
}

.hero h1{
    font-size:3.5rem;
    font-weight:700;
    margin-bottom:15px;
}

.hero p{
    font-size:1.2rem;
    margin-bottom:40px;
    opacity:0.9;
}

.hero-buttons{
    display:flex;
    gap:20px;
}

.btn{
    padding:15px 40px;
    border-radius:30px;
    border:none;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    text-decoration:none;
    display:inline-block;
}

.btn-primary{
    background:#ffffff;
    color:black;
}

.btn-primary:hover{
    background:#e5e5e5;
}

.btn-outline{
    background:transparent;
    border:2px solid white;
    color:white;
}

.btn-outline:hover{
    background:white;
    color:black;
}

@media(max-width:900px){
    .nav-links{display:none;}
    .hero h1{font-size:2.5rem;}
    .hero-buttons{flex-direction:column;}
}
</style>
</head>

<body>

<nav>
    <div class="logo">GreenPowerSense</div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Energy</a>
        <a href="#">Green</a>
        <a href="#">Dashboard</a>
        <a href="#">Shop</a>
    </div>

    <div class="nav-right">
        <div id="userProfile" class="user-profile"></div>
        <button id="logoutBtn" class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<section class="hero">

    <h2>GreenPowerSense</h2>
    <h1>Power Your Home Smartly</h1>
    <p>Monitor electricity usage, reduce costs, and switch to clean green energy.</p>

    <div id="authButtons" class="hero-buttons">
        <a id="getStartedBtn" href="login.html" class="btn btn-primary">Get Started</a>
        <a href="signup.html" class="btn btn-outline">Sign Up</a>
    </div>

</section>

<script>
window.onload = function(){
    let loggedIn = localStorage.getItem("gps_loggedin");
    let username = localStorage.getItem("gps_username");

    if(loggedIn === "true" && username){
        document.getElementById("authButtons").style.display = "none";

        let profile = document.getElementById("userProfile");
        profile.style.display = "block";
        profile.innerHTML = "Hi, " + username;

        document.getElementById("logoutBtn").style.display = "inline-block";

        // Change Get Started destination when logged in
        document.getElementById("getStartedBtn").href = "dashboard.html";
    }
}

function logout(){
    localStorage.setItem("gps_loggedin","false");
    window.location.reload();
}
</script>

</body>
</html>

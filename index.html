<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenPowerSense</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    background: url("GreenPowerSense.jpg") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

/* Dark overlay */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:0;
}

.container{
    position:relative;
    z-index:1;
    max-width:800px;
    padding:20px;
}

h1{
    font-size:48px;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:20px;
    color:#ffffff;
}

.highlight{
    color:#3b82f6;   /* Professional Blue */
}

p{
    font-size:18px;
    margin-bottom:30px;
    color:#e2e8f0;
}

/* Buttons */
.hero-buttons{
    margin-top:20px;
}

.btn{
    display:inline-block;
    padding:12px 30px;
    margin:10px;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
    background:#3b82f6;
    color:white;
    transition:0.3s;
}

.btn:hover{
    background:#2563eb;
    transform:scale(1.08);
}

.btn.secondary{
    background:#0f172a;
}

.btn.secondary:hover{
    background:#1e293b;
}
</style>
</head>

<body>

<div class="container">
    <h1><span class="highlight">Green</span>PowerSense</h1>

    <p>
        Intelligent Electricity Analysis & Smart Solar Guidance for Modern Homes.
    </p>

    <div class="hero-buttons">
        <a href="login.html" class="btn">Get Started</a>
        <a href="admin.html" class="btn secondary">Admin Panel</a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenPowerSense</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    background: url("GreenPowerSense.jpg") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    position:relative;
}

/* Dark overlay */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
}

.container{
    position:relative;
    z-index:1;
    max-width:800px;
    padding:20px;
}

h1{
    font-size:50px;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:20px;
}

.highlight{
    color:#3b82f6; /* Professional blue */
}

p{
    font-size:18px;
    margin-bottom:40px;
    color:#e2e8f0;
}

.btn{
    display:inline-block;
    padding:14px 35px;
    border-radius:40px;
    text-decoration:none;
    font-weight:600;
    font-size:18px;
    background:#3b82f6;
    color:white;
    transition:0.3s ease;
}

.btn:hover{
    background:#2563eb;
    transform:scale(1.08);
}
</style>
</head>

<body>

<div class="container">
    <h1><span class="highlight">Green</span>PowerSense</h1>

    <p>
        Smart Energy Analysis & Solar Guidance for Modern Homes.
    </p>

    <!-- ONLY ONE BUTTON -->
    <a href="auth.html" class="btn">Get Started</a>

</div>

</body>
</html>

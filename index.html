<!DOCTYPE html>
<html>
<head>
<title>GreenPowerSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}

.container{
    max-width:600px;
}

h1{
    font-size:40px;
    margin-bottom:20px;
}

button{
    padding:14px 28px;
    margin:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    background:#00c6ff;
    color:white;
    transition:0.3s;
}

button:hover{
    background:#0072ff;
}

#userGreeting{
    margin-top:15px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">
    <h1>GreenPowerSense</h1>
    <p>Smart Green Energy Analysis System</p>

    <!-- Username will appear here -->
    <div id="userGreeting"></div>

    <button onclick="location.href='login.html'">Login</button>
    <button onclick="location.href='signup.html'">Sign Up</button>
</div>

<script>
// Show username if logged in
let user = JSON.parse(localStorage.getItem("loggedInUser"));

if(user){
    document.getElementById("userGreeting").innerHTML =
        "Hi, " + user.name + " 👋";
}
</script>

</body>
</html>

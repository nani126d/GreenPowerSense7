<!DOCTYPE html>
<html>
<head>
<title>GreenPowerSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}

.container{
    max-width:600px;
}

h1{
    font-size:40px;
    margin-bottom:20px;
}

button{
    padding:14px 28px;
    margin:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    background:#00c6ff;
    color:white;
    transition:0.3s;
}

button:hover{
    background:#0072ff;
}

#welcome{
    font-size:20px;
    margin-bottom:20px;
}
</style>
</head>
<body>

<div class="container">

    <h1>GreenPowerSense</h1>

    <div id="welcome"></div>

    <div id="authButtons">
        <button onclick="location.href='login.html'">Login</button>
        <button onclick="location.href='signup.html'">Sign Up</button>
    </div>

    <button id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>

</div>

<script>

// Check if user is logged in
let user = JSON.parse(localStorage.getItem("loggedInUser"));

if(user){
    document.getElementById("welcome").innerHTML = "Hi, " + user.name + " 👋";
    document.getElementById("authButtons").style.display = "none";
    document.getElementById("logoutBtn").style.display = "inline-block";
}

function logout(){
    localStorage.removeItem("loggedInUser");
    location.reload();
}

</script>

</body>
</html>

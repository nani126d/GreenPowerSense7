<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenPowerSense</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}

.container{
    max-width:600px;
}

h1{
    font-size:3rem;
    color:#00ff99;
    margin-bottom:20px;
}

p{
    font-size:1.2rem;
    margin-bottom:40px;
}

button{
    padding:15px 40px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#00ff99,#00cc77);
    color:white;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}
</style>
</head>

<body>

<div class="container">
    <h1>🌿 GreenPowerSense</h1>
    <p>Monitor your electricity, save energy & reduce CO₂ emissions</p>
    <button onclick="location.href='login.html'">🚀 Get Started</button>
</div>

</html>

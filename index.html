<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenPowerSense | Home</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
html, body { height:100%; }
body {
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
#particles {
  position:fixed; width:100%; height:100%; top:0; left:0; z-index:-1;
}
.container {
  text-align:center;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border-radius:20px;
  padding:50px 20px;
  opacity:0;
  transform:translateY(50px);
  transition:0.8s;
  max-width:400px;
}
h1 { color:#00ff99; margin-bottom:30px; font-size:2.2rem; }
button {
  width:80%; padding:15px; margin:15px 0; border:none; border-radius:30px;
  font-weight:bold; cursor:pointer; background:linear-gradient(45deg,#00ff99,#00cc77);
  color:white; font-size:1rem; transition:0.5s;
}
button:hover {
  transform:scale(1.05);
  box-shadow:0 0 25px #00ff99;
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container" id="homeContainer">
  <h1>🌿 GreenPowerSense</h1>
  <button onclick="location.href='dashboard.html'">Dashboard</button>
  <button onclick="location.href='bill.html'">Bill Analysis</button>
  <button onclick="location.href='apps.html'">Appliances</button>
  <button onclick="location.href='solar.html'">Solar Estimation</button>
</div>

<script>
// Connected Particle Animation
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
  constructor() {
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.vx = (Math.random()-0.5)*1.2;
    this.vy = (Math.random()-0.5)*1.2;
    this.size = Math.random()*2+1;
  }
  move() {
    this.x += this.vx;
    this.y += this.vy;
    if(this.x<0||this.x>canvas.width) this.vx*=-1;
    if(this.y<0||this.y>canvas.height) this.vy*=-1;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle = "#00ff99";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#00ff99";
    ctx.fill();
  }
}

let particles=[];
for(let i=0;i<80;i++) particles.push(new Particle());

function connect() {
  for(let a=0;a<particles.length;a++){
    for(let b=a+1;b<particles.length;b++){
      let dx = particles[a].x - particles[b].x;
      let dy = particles[a].y - particles[b].y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if(dist<120){
        ctx.beginPath();
        ctx.strokeStyle = `rgba(0,255,153,${1-dist/120})`;
        ctx.lineWidth = 1;
        ctx.moveTo(particles[a].x,particles[a].y);
        ctx.lineTo(particles[b].x,particles[b].y);
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{p.move(); p.draw();});
  connect();
  requestAnimationFrame(animate);
}
animate();

window.onload = () => {
  const container = document.getElementById("homeContainer");
  setTimeout(() => {
    container.style.opacity = "1";
    container.style.transform = "translateY(0)";
  }, 200);
}

window.onresize = () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
</script>
</body>
</html>

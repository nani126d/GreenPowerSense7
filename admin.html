<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | GreenPowerSense</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
    padding:50px 20px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
}

h1{color:#00ff99;margin-bottom:20px;}
input{width:70%;padding:12px;margin:10px 0;border:none;border-radius:10px;}
button{padding:12px 25px;background:#00ff99;border:none;border-radius:30px;cursor:pointer;font-weight:bold;transition:0.3s;}
button:hover{background:#00cc77;transform:scale(1.05);}
table{width:100%;margin-top:20px;border-collapse:collapse;}
th,td{border:1px solid #00ff99;padding:8px;border-radius:5px;}
#adminPanel{display:none;}
a{display:block;margin-top:30px;color:#00ff99;text-decoration:none;}
</style>
</head>

<body>

<div class="container">
<h1>🔐 Admin Login</h1>

<input type="text" id="adminUser" placeholder="Username">
<input type="password" id="adminPass" placeholder="Password">
<button onclick="adminLogin()">Login</button>

<div id="adminPanel">
<h2>📊 All Energy Records</h2>
<table id="adminTable">
<tr><th>Month</th><th>Units</th><th>CO₂ (kg)</th></tr>
</table>

<h3>Summary</h3>
<p>Total Units: <span id="totalUnits">0</span> kWh</p>
<p>Total CO₂: <span id="totalCarbon">0</span> kg</p>
<p>Energy Score: <span id="energyScore">0</span> / 100</p>

<button onclick="clearAllHistory()">Clear All Records</button>
</div>

<a href="dashboard.html">⬅ Go to Dashboard</a>
</div>

<script>
function adminLogin(){
    let user = document.getElementById("adminUser").value;
    let pass = document.getElementById("adminPass").value;

    if(user === "admin" && pass === "1234"){
        document.getElementById("adminPanel").style.display = "block";
        loadAdminData();
    } else {
        alert("Invalid credentials");
    }
}

function loadAdminData(){
    let history = JSON.parse(localStorage.getItem("energyHistory")) || [];
    let table = document.getElementById("adminTable");

    table.innerHTML = `<tr><th>Month</th><th>Units</th><th>CO₂ (kg)</th></tr>`;

    let totalUnits = 0, totalCarbon = 0;

    history.forEach(r=>{
        table.innerHTML += `<tr>
            <td>${r.month}</td>
            <td>${r.units}</td>
            <td>${r.carbon}</td>
        </tr>`;
        totalUnits += parseFloat(r.units);
        totalCarbon += parseFloat(r.carbon);
    });

    let score = history.length>0 ? Math.max(0,100 - (totalUnits/history.length)/5) : 0;

    document.getElementById("totalUnits").innerText = totalUnits.toFixed(2);
    document.getElementById("totalCarbon").innerText = totalCarbon.toFixed(2);
    document.getElementById("energyScore").innerText = score.toFixed(0);
}

function clearAllHistory(){
    if(confirm("Are you sure to clear all records?")){
        localStorage.removeItem("energyHistory");
        loadAdminData();
    }
}
</script>

</body>
</html>

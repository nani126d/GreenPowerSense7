<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}
body{
    background:#0f172a;
    color:white;
}
.center{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    background:#1e293b;
    padding:40px;
    border-radius:12px;
    width:350px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}
h2{
    text-align:center;
    margin-bottom:25px;
    color:#22c55e;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:6px;
    outline:none;
}
button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#22c55e;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#16a34a;
}
.dashboard{
    display:none;
    padding:30px;
}
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}
.logout{
    background:#ef4444;
}
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}
.box{
    background:#1e293b;
    padding:25px;
    border-radius:10px;
    text-align:center;
}
.box h3{
    color:#22c55e;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="center" id="loginPage">
    <div class="card">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="topbar">
        <h2>Admin Dashboard</h2>
        <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="stats">
        <div class="box">
            <h3>Users</h3>
            <p id="users">120</p>
        </div>
        <div class="box">
            <h3>Energy Records</h3>
            <p id="records">340</p>
        </div>
        <div class="box">
            <h3>Revenue</h3>
            <p id="revenue">₹25,000</p>
        </div>
        <div class="box">
            <h3>Status</h3>
            <p>Active</p>
        </div>
    </div>
</div>

<script>

// Simple session check
if(sessionStorage.getItem("adminLoggedIn")){
    showDashboard();
}

function login(){
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "admin" && pass === "2025"){
        sessionStorage.setItem("adminLoggedIn", true);
        showDashboard();
    } else {
        alert("Invalid Credentials");
    }
}

function showDashboard(){
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
}

function logout(){
    sessionStorage.removeItem("adminLoggedIn");
    location.reload();
}

</script>

</body>
</html>

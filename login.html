<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | GreenPowerSense</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html, body{height:100%;}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#particles{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:-1;
}

.container{
    width:350px;
    padding:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:20px;
    text-align:center;
    opacity:0;
    transform:translateY(40px);
    transition:0.6s ease;
}

h1{color:#00ff99;margin-bottom:20px;font-size:2rem;}

input{
    width:95%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#00ff99,#00cc77);
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00ff99;
}

.error{
    color:#ff6b6b;
    font-size:0.9rem;
    margin-top:10px;
    min-height:20px;
}

.success{
    color:#00ff99;
    font-size:0.9rem;
    margin-top:10px;
}

a{color:#00ff99;text-decoration:none;}
p{margin-top:15px;font-size:0.9rem;}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container" id="loginContainer">
    <h1>🔐 User Login</h1>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="message" class="error"></div>
    <p>Don't have an account? <a href="register.html">Register here</a></p>
</div>

<script>
/* ================= PARTICLE BACKGROUND ================= */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles=[];
for(let i=0;i<80;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2+1,
        dx:(Math.random()-0.5)*0.5,
        dy:(Math.random()-0.5)*0.5
    });
}

function animateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="rgba(0,255,153,0.6)";
        ctx.fill();
        p.x+=p.dx;
        p.y+=p.dy;
        if(p.x<0||p.x>canvas.width)p.dx*=-1;
        if(p.y<0||p.y>canvas.height)p.dy*=-1;
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

/* ================= ENTRANCE ANIMATION ================= */
window.onload = ()=>{
    const container=document.getElementById("loginContainer");
    setTimeout(()=>{
        container.style.opacity="1";
        container.style.transform="translateY(0)";
    },200);
};

/* ================= DEFAULT USERS ================= */
if(!localStorage.getItem("users")){
    const defaultUsers=[
        {username:"student", password:"1234"},
        {username:"admin", password:"admin123"}
    ];
    localStorage.setItem("users", JSON.stringify(defaultUsers));
}

/* ================= LOGIN FUNCTION ================= */
function login(){
    const usernameInput=document.getElementById("username").value.trim().toLowerCase();
    const passwordInput=document.getElementById("password").value.trim();
    const message=document.getElementById("message");

    message.textContent="";
    message.className="error";

    if(!usernameInput || !passwordInput){
        message.textContent="Please enter both fields.";
        return;
    }

    let users=JSON.parse(localStorage.getItem("users")) || [];

    const foundUser=users.find(user =>
        user.username.toLowerCase()===usernameInput &&
        user.password===passwordInput
    );

    if(foundUser){
        localStorage.setItem("currentUser", foundUser.username);
        message.className="success";
        message.textContent="Login successful! Redirecting...";
        setTimeout(()=>{
            window.location.href="dashboard.html";
        },1000);
    }else{
        message.textContent="Invalid username or password.";
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Login - GreenPowerSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background: url("GreenPowerSense7.jpg") no-repeat center center/cover;
}

/* Improved solid box */
.login-box{
    width:520px;
    padding:40px;
    margin-right:70px;
    background:rgba(255,255,255,0.95);  /* Almost solid white */
    border-radius:15px;
    box-shadow:0 10px 35px rgba(0,0,0,0.4);
    color:#222;
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#111;
}

input{
    width:100%;
    padding:13px;
    margin:14px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#2ecc71;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#27ae60;
}

a{
    color:#2c3e50;
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <form onsubmit="loginUser(event)">
        <input type="text" id="loginUsername" placeholder="Username" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p style="text-align:center;margin-top:20px;">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </p>
</div>

<script>
function loginUser(e){
    e.preventDefault();

    let username = document.getElementById("loginUsername").value;
    let password = document.getElementById("loginPassword").value;

    let storedUser = localStorage.getItem("gps_username");
    let storedPass = localStorage.getItem("gps_password");

    if(username === storedUser && password === storedPass){
        localStorage.setItem("gps_loggedin", "true");
        alert("Login Successful!");
        window.location.href = "index.html";
    }else{
        alert("Invalid Username or Password!");
    }
}
</script>

</body>
</html>

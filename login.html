<!DOCTYPE html>
<html>
<head>
<title>Login - GreenPowerSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* Background Image */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
        url("GreenPowerSense7.jpg");
    background-size:cover;
    background-position:center;
}

/* Login Box */
.box{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    padding:40px;
    border-radius:15px;
    width:320px;
    text-align:center;
    color:white;
}

.box h2{
    margin-bottom:20px;
}

.box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:25px;
    outline:none;
}

.box button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:25px;
    background:#1e90ff;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.box button:hover{
    background:#005bea;
}

.box a{
    color:#ffffff;
    text-decoration:none;
    font-size:0.9rem;
}
</style>

</head>
<body>

<div class="box">
    <h2>Login</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <button onclick="window.location.href='dashboard.html'">Login</button>
    <p style="margin-top:15px;">
        Don't have an account? <a href="signup.html">Sign Up</a>
    </p>
</div>

</body>
</html>

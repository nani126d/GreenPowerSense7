<!DOCTYPE html>
<html>
<head>
<title>Login - GreenPowerSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* Background Animation */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg,#2ecc71,#3498db,#1abc9c,#16a085);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

/* Moving Gradient */
@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Glass Box */
.box{
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.15);
    padding:40px;
    width:340px;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    text-align:center;
    animation: fadeSlide 1s ease;
}

/* Fade Animation */
@keyframes fadeSlide{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    color:white;
    margin-bottom:25px;
}

/* Floating Input Container */
.input-group{
    position:relative;
    margin:20px 0;
}

.input-group input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    background:rgba(255,255,255,0.8);
    font-size:14px;
}

/* Floating Label */
.input-group label{
    position:absolute;
    left:12px;
    top:12px;
    color:#555;
    font-size:14px;
    transition:0.3s;
    pointer-events:none;
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label{
    top:-10px;
    left:8px;
    font-size:12px;
    color:#2ecc71;
    background:white;
    padding:2px 6px;
    border-radius:4px;
}

/* Button */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#27ae60;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1e8449;
    box-shadow:0 0 15px #2ecc71;
}

/* Loading Spinner */
.loader{
    display:none;
    margin:15px auto 0;
    border:4px solid #fff;
    border-top:4px solid #2ecc71;
    border-radius:50%;
    width:25px;
    height:25px;
    animation: spin 1s linear infinite;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

#error{
    color:#ffdddd;
    margin-top:10px;
    font-size:13px;
}

</style>
</head>

<body>

<div class="box">
<h2>GreenPowerSense Login</h2>

<div class="input-group">
<input type="text" id="username" placeholder=" " required>
<label>Username</label>
</div>

<div class="input-group">
<input type="password" id="password" placeholder=" " required>
<label>Password</label>
</div>

<button onclick="loginUser()">Login</button>

<div class="loader" id="loader"></div>
<div id="error"></div>

</div>

<script>

function loginUser(){

    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();
    let loader = document.getElementById("loader");
    let error = document.getElementById("error");

    if(username === "" || password === ""){
        error.innerText = "Please enter both username and password.";
        return;
    }

    error.innerText = "";
    loader.style.display = "block";

    // Fake loading delay (for realism)
    setTimeout(function(){

        localStorage.setItem("currentUser", username);

        loader.style.display = "none";
        window.location.href = "home.html";

    },1500);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GreenPowerSense</title>

<style>

body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    height:100vh;
    display:flex;
    justify-content:flex-end;   /* Moves box to right */
    align-items:center;
    padding-right:80px;

    background: url('GreenPowerSense7.jpg') no-repeat center center/cover;
}

/* Login Box */
.login-box{
    width:450px;              /* 🔥 Increased WIDTH */
    padding:40px;
    background: rgba(255,255,255,0.95);
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    background:#1e293b;
    color:white;
    transition:0.3s;
}

button:hover{
    background:#0f172a;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    text-decoration:none;
    color:#1e293b;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <input type="email" placeholder="Email Address">
    <input type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p>Don't have an account? 
       <a href="signup.html">Create an account</a>
    </p>
</div>

<script>
function login(){
    alert("Login functionality will be connected to backend later.");
}
</script>

</body>
</html>

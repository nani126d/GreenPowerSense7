<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GreenPowerSense</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* ===== BACKGROUND ===== */
body{
    height:100vh;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding-right:6%;
    background:
        linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
        url("GreenPowerSense7.jpg");
    background-size:cover;
    background-position:center;
}

/* ===== LOGIN BOX ===== */
.box{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(25px);
    padding:60px;
    border-radius:20px;
    width:420px;          /* Bigger width */
    color:white;
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

.box h2{
    margin-bottom:30px;
    text-align:center;
    font-size:28px;
}

.box input{
    width:100%;
    padding:16px;
    margin:15px 0;
    border:none;
    border-radius:30px;
    outline:none;
    font-size:15px;
}

.box button{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:none;
    border-radius:30px;
    background:#1e90ff;
    color:white;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.box button:hover{
    background:#005bea;
}

.box p{
    margin-top:20px;
    text-align:center;
}

.box a{
    color:#1e90ff;
    text-decoration:none;
    font-weight:600;
}

/* Mobile */
@media(max-width:768px){
    body{
        justify-content:center;
        padding-right:0;
    }
    .box{
        width:90%;
        padding:40px;
    }
}
</style>
</head>

<body>

<div class="box">
    <h2>Login to GreenPowerSense</h2>

    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">

    <button onclick="window.location.href='dashboard.html'">
        Login
    </button>

    <p>
        Don't have an account?
        <a href="signup.html">Create an Account</a>
    </p>
</div>

</body>
</html>

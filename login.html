<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GreenPowerSense</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* ===== BACKGROUND ===== */
body{
    height:100vh;
    display:flex;
    justify-content:flex-end;   /* Moves box to RIGHT */
    align-items:center;
    padding-right:8%;          /* Space from right edge */
    background:
        linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
        url("GreenPowerSense7.jpg");
    background-size:cover;
    background-position:center;
}

/* ===== LOGIN BOX ===== */
.box{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    padding:45px;
    border-radius:15px;
    width:350px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.box h2{
    margin-bottom:25px;
    text-align:center;
}

.box input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border:none;
    border-radius:25px;
    outline:none;
}

.box button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:25px;
    background:#1e90ff;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.box button:hover{
    background:#005bea;
}

.box a{
    color:#1e90ff;
    text-decoration:none;
    font-weight:600;
}

/* Mobile Responsive */
@media(max-width:768px){
    body{
        justify-content:center;
        padding-right:0;
    }
}
</style>

</head>
<body>

<div class="box">
    <h2>Login</h2>

    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">

    <button onclick="window.location.href='dashboard.html'">
        Login
    </button>

    <p style="margin-top:15px; text-align:center;">
        Don't have an account?
        <a href="signup.html">Create an Account</a>
    </p>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Login - GreenPowerSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    font-family:Arial;
    background:linear-gradient(135deg,#2ecc71,#3498db);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:30px;
    border-radius:12px;
    width:320px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#27ae60;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>Login</h2>

<input type="text" id="username" placeholder="Enter Username">
<input type="password" id="password" placeholder="Enter Password">

<button onclick="loginUser()">Login</button>

</div>

<script>
function loginUser(){
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(username && password){
        localStorage.setItem("gpsUser", username);
        window.location.href = "home.html";   // 🔥 This connects to home
    } else {
        alert("Enter valid details");
    }
}
</script>

</body>
</html>
